name: Build Android APK

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - 'lib/**'
      - 'shaders/**'
      - 'test/**'
      - 'pubspec.yaml'
      - 'analysis_options.yaml'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Record tool versions
        run: |
          flutter --version
          java -version
      - name: Generate Android platform wrapper only
        run: |
          flutter create --platforms=android --project-name=glass_refraction_demo --org=com.example --empty --no-pub .platform_seed
          cp -R .platform_seed/android ./android
          flutter pub get
      - name: Parse and format Dart in build workspace
        run: dart format lib test integration_test
      - name: Analyze
        run: flutter analyze
      - name: Widget tests
        run: flutter test test
      - name: Build installable demo APKs
        run: flutter build apk --release --split-per-abi --target-platform android-arm,android-arm64 --no-tree-shake-icons
      - name: Verify packages
        run: |
          unzip -t build/app/outputs/flutter-apk/app-arm64-v8a-release.apk > /dev/null
          unzip -t build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk > /dev/null
          sha256sum build/app/outputs/flutter-apk/*.apk
      - uses: actions/upload-artifact@v4
        with:
          name: glass-demo-arm64
          path: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
      - uses: actions/upload-artifact@v4
        with:
          name: glass-demo-arm32
          path: build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
